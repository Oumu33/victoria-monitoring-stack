# VictoriaMetrics 监控栈（单机生产级）
#
# 一条命令启动完整监控栈：
#   cp .env.example .env   # 按需修改密码与 Webhook
#   docker compose up -d
#
# 架构：vmagent(采集) -> VictoriaMetrics(存储) -> vmalert(告警) -> alertmanager(通知)
#                                          └-> Grafana(展示) / vmui(内置UI)

name: vm-monitoring-stack

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: vm-single
    restart: unless-stopped
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-12}"
      - "--httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - monitoring

  vmagent:
    image: victoriametrics/vmagent:v1.153.0
    container_name: vmagent
    restart: unless-stopped
    command:
      - "--promscrape.config=/etc/vmagent/scrape.yml"
      - "--remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "--httpListenAddr=:8429"
    ports:
      - "8429:8429"
    volumes:
      - ./config/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
      - vmagent-data:/vmagent-remotewrite-data
    depends_on:
      victoria-metrics:
        condition: service_healthy
    networks:
      - monitoring

  vmalert:
    image: victoriametrics/vmalert:v1.153.0
    container_name: vmalert
    restart: unless-stopped
    command:
      - "--datasource.url=http://victoria-metrics:8428"
      - "--remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "--notifier.url=http://alertmanager:9093"
      - "--rule=/etc/vmalert/rules/*.yml"
      - "--evaluationInterval=30s"
      - "--httpListenAddr=:8880"
    ports:
      - "8880:8880"
    volumes:
      - ./config/vmalert/rules:/etc/vmalert/rules:ro
    depends_on:
      - victoria-metrics
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.33.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      - WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://localhost:5001/webhook}
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - victoria-metrics
    networks:
      - monitoring

  # 演示用采集目标：启动后即有数据，方便验证整条链路
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  vm-data:
  vmagent-data:
  grafana-data:
